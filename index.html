<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasker</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="container">
        <div class="taskBox">
            <br><h1>Welcome to Tasker!</h1><br>
            <h3 style="text-align: center;">Add tasks <img src="images/checks.svg" height="20px" width="20px" style="vertical-align: middle;"></h3>
            <br>
            <div class="addTasks">
                <input type="text" id="taskInput" placeholder="Add a new task...">
                <button onclick="addTask()"><img src="images/plus-circle.svg" height="40px" width="40px" style="vertical-align: middle;"></button>
            </div>
            <div class="listBox">
                    <ul id="taskList">
                    <!--<li class="checked">Task 1</li>
                    <li>Task 2</li>
                    <li>Task 3</li>-->
                </ul>
            </div>
        </div>
        <div id="progress-bar-container" class="progress-bar">
            <div id="progress" class="progress"></div>
            <div id="progressMessage"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
